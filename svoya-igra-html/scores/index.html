<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Очки — Своя игра</title>

  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    body { background:#000; color:#fff; }
    .wrap { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    h1 { margin: 0 0 16px; font-size: 28px; font-weight: 700; opacity: .9; }
    .hint { opacity:.7; margin-bottom: 14px; }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .card {
      border: 2px solid rgba(120,180,255,.35);
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(20,40,80,.25);
    }
    .name { font-size: 22px; font-weight: 650; }
    .score {
      font-size: 28px;
      font-weight: 800;
      min-width: 90px;
      text-align: right;
      color: #9fd1ff;
    }
    .empty { opacity:.7; padding: 12px 4px; }
    .topbar { display:flex; gap:12px; align-items:center; justify-content:space-between; }
    .small { font-size: 14px; opacity:.65; }
  </style>

  <!-- 1) Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 2) Твой клиент -->
  <script src="../assets/js/supabase.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>Очки игроков</h1>
      <div class="small" id="status">подключение…</div>
    </div>
    <div class="hint">Эту страницу удобно открыть на планшете. Она сама обновляется.</div>
    <div id="grid" class="grid"></div>
  </div>

  <script src="../assets/js/scores.js"></script>
</body>
</html>
